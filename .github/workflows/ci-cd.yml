name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main, develop, staging ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - dev
          - staging
          - production

env:
  AWS_REGION: us-east-1

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      build-version: ${{ steps.version.outputs.BUILD_VERSION }}
      environment: ${{ steps.env.outputs.ENVIRONMENT }}
    steps:
      - name: Generate Build Version
        id: version
        run: |
          VERSION="${{ github.run_number }}-${GITHUB_SHA::7}"
          echo "BUILD_VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Determine Environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="production"
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            ENV="staging"
          else
            ENV="dev"
          fi
          echo "ENVIRONMENT=${ENV}" >> $GITHUB_OUTPUT

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint || echo "Linting completed with warnings"

      - name: Run TypeScript Compiler
        run: npx tsc --noEmit

  coding-standards:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Coding Standards Checks
        shell: pwsh
        run: ./scripts/run-all-checks.ps1

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm run test -- --run --coverage

      - name: Upload Coverage Reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          # If you wish to specify custom queries, you can do so here or in a config file.
          # By default, queries listed here will override any specified in a config file.
          # Prefix the list here with "+" to use these queries and those in the config file.

          # Details on CodeQL packets: https://codeql.github.com/codeql-query-help/python-example-queries/
          # queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true

      - name: Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk.sarif
        continue-on-error: true

      - name: Upload Snyk result to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: snyk.sarif

  build-frontend:
    runs-on: ubuntu-latest
    needs: [setup, lint, test, security-scan]
    environment: ${{ needs.setup.outputs.environment }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch Secrets from AWS Secrets Manager
        id: secrets
        run: |
          SECRETS=$(aws secretsmanager get-secret-value \
            --secret-id sensaai/${{ needs.setup.outputs.environment }}/config \
            --query SecretString \
            --output text)
          
          echo "IDENTITY_POOL_ID=$(echo $SECRETS | jq -r .VITE_COGNITO_IDENTITY_POOL_ID)" >> $GITHUB_OUTPUT
          echo "USER_POOL_ID=$(echo $SECRETS | jq -r .VITE_COGNITO_USER_POOL_ID)" >> $GITHUB_OUTPUT
          echo "S3_BUCKET=$(echo $SECRETS | jq -r .VITE_AWS_S3_BUCKET_NAME)" >> $GITHUB_OUTPUT
          echo "DDB_TABLE=$(echo $SECRETS | jq -r .VITE_AWS_DYNAMODB_TABLE_NAME)" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        env:
          VITE_COGNITO_IDENTITY_POOL_ID: ${{ steps.secrets.outputs.IDENTITY_POOL_ID }}
          VITE_COGNITO_USER_POOL_ID: ${{ steps.secrets.outputs.USER_POOL_ID }}
          VITE_AWS_S3_BUCKET_NAME: ${{ steps.secrets.outputs.S3_BUCKET }}
          VITE_AWS_DYNAMODB_TABLE_NAME: ${{ steps.secrets.outputs.DDB_TABLE }}
          VITE_AWS_REGION: ${{ env.AWS_REGION }}
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ needs.setup.outputs.build-version }}
          path: dist/
          retention-days: 30

  notify:
    runs-on: ubuntu-latest
    needs: [setup, build-frontend]
    environment: ${{ needs.setup.outputs.environment }}
    if: always()
    permissions:
      deployments: write
      contents: read
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Determine Status
        id: status
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "MESSAGE=✓ Deployment successful for version ${{ needs.setup.outputs.build-version }}" >> $GITHUB_OUTPUT
            echo "COLOR=good" >> $GITHUB_OUTPUT
          else
            echo "MESSAGE=✗ Deployment failed for version ${{ needs.setup.outputs.build-version }}" >> $GITHUB_OUTPUT
            echo "COLOR=danger" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v1
        if: always() && env.SLACK_WEBHOOK_URL != ''
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "SensaAI CI/CD Notification"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Status:*\n${{ steps.status.outputs.MESSAGE }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n${{ github.sha }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author:*\n${{ github.actor }}"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }

      - name: Create GitHub Deployment
        uses: actions/github-script@v6
        if: success()
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: '${{ needs.setup.outputs.environment }}',
              production_environment: '${{ needs.setup.outputs.environment }}' === 'production',
              auto_merge: false,
              required_contexts: []
            });
