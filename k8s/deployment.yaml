apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensapbl-frontend
  namespace: sensapbl
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sensapbl-frontend
  template:
    metadata:
      labels:
        app: sensapbl-frontend
    spec:
      containers:
      - name: frontend
        image: 311964231104.dkr.ecr.us-east-1.amazonaws.com/sensapbl-pilot-frontend:latest
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "250m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: sensapbl-frontend
  namespace: sensapbl
spec:
  selector:
    app: sensapbl-frontend
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensapbl-backend
  namespace: sensapbl
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sensapbl-backend
  template:
    metadata:
      labels:
        app: sensapbl-backend
    spec:
      containers:
      - name: backend
        image: 311964231104.dkr.ecr.us-east-1.amazonaws.com/sensapbl-pilot-backend:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: sensapbl-config
        - secretRef:
            name: sensapbl-secrets
        resources:
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: sensapbl-backend
  namespace: sensapbl
spec:
  selector:
    app: sensapbl-backend
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sensapbl-ingress
  namespace: sensapbl
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: sensapbl-backend
            port:
              number: 3000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sensapbl-frontend
            port:
              number: 80
