version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
customHeaders:
  # index.html must never be cached so browsers always get the current
  # chunk manifest after a new deploy (content-hashed filenames change).
  - pattern: index.html
    headers:
      - key: Cache-Control
        value: 'no-cache, no-store, must-revalidate'
      - key: Pragma
        value: no-cache
      - key: Expires
        value: '0'
  # Content-hashed JS/CSS bundles are immutable — cache for 1 year.
  - pattern: 'assets/*.js'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
  - pattern: 'assets/*.css'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
  - pattern: 'assets/*.woff2'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
