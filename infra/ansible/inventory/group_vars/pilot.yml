# Pilot Environment Ansible Variables

# Environment name
env: pilot

# Scaling (minimal for pilot)
frontend_replicas: 2
backend_replicas: 2
worker_replicas: 1

# Resource limits
resource_limits:
  frontend:
    cpu: "500m"
    memory: "512Mi"
  backend:
    cpu: "1000m"
    memory: "1Gi"
  worker:
    cpu: "2000m"
    memory: "2Gi"

# Ingress
ingress_host: pilot.sensapbl.com
enable_ssl: true

# Cognito (populated from Terraform outputs)
cognito_user_pool_id: ""
cognito_client_id: ""
cognito_domain: ""

# Database (populated from Terraform outputs)
rds_endpoint: ""

# Redis (populated from Terraform outputs)
redis_endpoint: ""
