---
# SensaPBL Master Ansible Playbook

- name: Configure Kubernetes and Deploy Application
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../inventory/group_vars/all.yml
    - "../inventory/group_vars/{{ env }}.yml"

  tasks:
    - name: Get Terraform outputs
      command: terraform output -json
      args:
        chdir: "../../terraform"
      register: tf_output
      changed_when: false

    - name: Parse Terraform outputs
      set_fact:
        tf: "{{ tf_output.stdout | from_json }}"

    - name: Update kubeconfig for EKS
      command: >
        aws eks update-kubeconfig
        --name {{ tf.eks_cluster_name.value }}
        --region {{ aws_region }}
      changed_when: false

    - name: Create application namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ k8s_namespace }}"
            labels:
              app: sensapbl
              environment: "{{ env }}"

    - name: Create ConfigMap with application config
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: sensapbl-config
            namespace: "{{ k8s_namespace }}"
          data:
            AWS_REGION: "{{ aws_region }}"
            COGNITO_USER_POOL_ID: "{{ tf.cognito_user_pool_id.value }}"
            COGNITO_CLIENT_ID: "{{ tf.cognito_client_id.value }}"
            REDIS_HOST: "{{ tf.redis_endpoint.value }}"

    - name: Create Secret for database credentials
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: sensapbl-db-secret
            namespace: "{{ k8s_namespace }}"
          type: Opaque
          stringData:
            DATABASE_URL: "postgresql://sensapbl@{{ tf.rds_endpoint.value }}/sensapbl"

    - name: Deploy frontend
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: sensapbl-frontend
            namespace: "{{ k8s_namespace }}"
          spec:
            replicas: "{{ frontend_replicas }}"
            selector:
              matchLabels:
                app: sensapbl-frontend
            template:
              metadata:
                labels:
                  app: sensapbl-frontend
              spec:
                containers:
                  - name: frontend
                    image: "{{ tf.ecr_frontend_url.value }}:{{ app_version }}"
                    ports:
                      - containerPort: 80
                    resources:
                      limits:
                        cpu: "{{ resource_limits.frontend.cpu }}"
                        memory: "{{ resource_limits.frontend.memory }}"
                    livenessProbe:
                      httpGet:
                        path: /health
                        port: 80
                      initialDelaySeconds: 10
                      periodSeconds: 30
                    readinessProbe:
                      httpGet:
                        path: /health
                        port: 80
                      initialDelaySeconds: 5
                      periodSeconds: 10

    - name: Deploy backend
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: sensapbl-backend
            namespace: "{{ k8s_namespace }}"
          spec:
            replicas: "{{ backend_replicas }}"
            selector:
              matchLabels:
                app: sensapbl-backend
            template:
              metadata:
                labels:
                  app: sensapbl-backend
              spec:
                containers:
                  - name: backend
                    image: "{{ tf.ecr_backend_url.value }}:{{ app_version }}"
                    ports:
                      - containerPort: 3000
                    envFrom:
                      - configMapRef:
                          name: sensapbl-config
                      - secretRef:
                          name: sensapbl-db-secret
                    resources:
                      limits:
                        cpu: "{{ resource_limits.backend.cpu }}"
                        memory: "{{ resource_limits.backend.memory }}"
                    livenessProbe:
                      httpGet:
                        path: /health
                        port: 3000
                      initialDelaySeconds: 15
                      periodSeconds: 30
                    readinessProbe:
                      httpGet:
                        path: /ready
                        port: 3000
                      initialDelaySeconds: 10
                      periodSeconds: 10

    - name: Create frontend service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: sensapbl-frontend
            namespace: "{{ k8s_namespace }}"
          spec:
            selector:
              app: sensapbl-frontend
            ports:
              - port: 80
                targetPort: 80

    - name: Create backend service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: sensapbl-backend
            namespace: "{{ k8s_namespace }}"
          spec:
            selector:
              app: sensapbl-backend
            ports:
              - port: 3000
                targetPort: 3000

    - name: Create ALB Ingress
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: sensapbl-ingress
            namespace: "{{ k8s_namespace }}"
            annotations:
              kubernetes.io/ingress.class: alb
              alb.ingress.kubernetes.io/scheme: internet-facing
              alb.ingress.kubernetes.io/target-type: ip
          spec:
            rules:
              - host: "{{ ingress_host }}"
                http:
                  paths:
                    - path: /api
                      pathType: Prefix
                      backend:
                        service:
                          name: sensapbl-backend
                          port:
                            number: 3000
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: sensapbl-frontend
                          port:
                            number: 80

    - name: Deployment complete
      debug:
        msg: |
          SensaPBL deployed successfully!
          
          Frontend URL: https://{{ ingress_host }}
          Cognito Domain: {{ tf.cognito_domain.value }}
          User Pool ID: {{ tf.cognito_user_pool_id.value }}
